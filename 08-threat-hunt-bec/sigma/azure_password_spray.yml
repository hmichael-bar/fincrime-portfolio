title: Password Spray Against Entra ID From a Single Source IP
id: 6a3f1c52-8d2e-4b7a-9c41-2f0e5d7b8a11
status: experimental
description: >
  One IP address fails to sign in to many different accounts with a bad password
  in a short window - the signature of a password spray rather than a typo.
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: H. Michael Bourenane
date: 2026-11-19
tags:
  - attack.credential-access
  - attack.t1110.003
logsource:
  product: azure
  service: signinlogs
detection:
  selection:
    ResultType: 50126
  timeframe: 6h
  condition: selection | count(UserPrincipalName) by IPAddress > 20
falsepositives:
  - Misconfigured service or shared NAT gateway replaying an old password
level: high
